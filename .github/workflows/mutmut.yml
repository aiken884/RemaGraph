name: mutmut

# 非 blocking：不 gate PR merge，供開發者參考 mutation score。
# 本地執行：uv run mutmut run
#
# 故意不掛在 push/pull_request 上：mutation testing 本身要重跑測試套件
# 一次每個 mutant，成本遠高於一般 CI job，加上這本來就是 non-blocking、
# 純參考用的指標，沒有必要每次 commit 都跑一次。改成每週跑一次 + 手動觸發。

on:
  schedule:
    - cron: "0 18 * * 0" # 每週日 UTC 18:00(台北時間週一 02:00)
  workflow_dispatch:

jobs:
  mutmut:
    name: "mutation testing (arbitration + dedup)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.12

      - name: Install with frozen lockfile (dev extras)
        run: uv sync --frozen --extra dev

      - name: Run mutmut
        run: uv run mutmut run
        continue-on-error: true

      - name: Show mutmut results
        run: uv run mutmut results
        continue-on-error: true
