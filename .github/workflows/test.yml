name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    name: "smoke (py${{ matrix.python-version }} on ${{ matrix.os }})"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]
        # macOS runner-minutes are billed at a 10x multiplier vs Linux, so we
        # only exercise macOS on one Python version per push to keep CI cost
        # sane; full macOS x Python coverage still runs, just not 3x per push.
        exclude:
          - os: macos-latest
            python-version: "3.11"
          - os: macos-latest
            python-version: "3.13"

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install with frozen lockfile (dev extras)
        run: uv sync --frozen --extra dev

      - name: Verify SQLite >= 3.38 and trigram support
        run: uv run python -c "import sqlite3; v=sqlite3.sqlite_version_info; assert v>=(3,38,0), f'SQLite {v} < 3.38'; conn=sqlite3.connect(':memory:'); conn.execute(\"CREATE VIRTUAL TABLE t USING fts5(x, tokenize='trigram')\"); print(f'SQLite {v} + trigram OK')"

      - name: Run trigram CI gate
        run: uv run python ci/test_trigram_gate.py

      - name: Verify import
        run: uv run python -c "import remagraph; print(f'RemaGraph {remagraph.__version__} OK')"

      - name: Run smoke tests (isolated state)
        run: uv run pytest tests/smoke/ -v
        env:
          REMAGRAPH_STATE_DIR: ${{ runner.temp }}/remagraph-smoke

  adversarial:
    name: adversarial-smoke
    needs: smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.12

      - name: Install with frozen lockfile (dev extras)
        run: uv sync --frozen --extra dev

      - name: Run adversarial tests
        run: |
          # Run representative adversarial tests and always produce a junit xml for artifacts
          pytest tests/test_fuzz_regressions.py tests/test_adversarial_state_tamper.py tests/test_embedding_and_errors.py -q --junitxml=adversarial-results.xml || true

      - name: Upload adversarial results
        uses: actions/upload-artifact@v7
        with:
          name: adversarial-results
          path: adversarial-results.xml

  lint:
    name: lint
    needs: smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.12

      - name: Install with frozen lockfile (dev extras)
        run: uv sync --frozen --extra dev

      - name: Run ruff
        run: uv run ruff check .

      - name: Run mypy
        run: uv run mypy src/

  test:
    name: "test + coverage (py${{ matrix.python-version }} on ${{ matrix.os }})"
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]
        # Same macOS-cost rationale as the smoke job above.
        exclude:
          - os: macos-latest
            python-version: "3.11"
          - os: macos-latest
            python-version: "3.13"

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install with frozen lockfile (dev extras)
        run: uv sync --frozen --extra dev

      - name: Run tests with coverage
        run: uv run pytest --cov=src/remagraph --cov-fail-under=80 --cov-report=term --cov-report=xml

      - name: Upload coverage report
        if: matrix.python-version == '3.12' && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage.xml
