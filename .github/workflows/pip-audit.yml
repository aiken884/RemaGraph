name: pip-audit

on:
  push:
    branches: [main]
  pull_request:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.12

      - name: Install with frozen lockfile (dev extras)
        run: uv sync --frozen --extra dev

      - name: Install pip-audit
        run: uv run python -m pip install pip-audit

      - name: Run pip-audit from lockfile
        run: uv export --format requirements-txt --no-hashes | uv run python -m pip_audit -r /dev/stdin
