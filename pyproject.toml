[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "remagraph"
version = "0.7.1"
description = "Lightweight MCP tool that captures the trail an AI coding agent leaves behind while working (task handoff / status update / discovered constraint) for later agents to query."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [
    { name = "Aiken Lin" },
]
dependencies = [
    "model2vec>=0.1.0,<2.0",
    "mcp>=1.0.0,<2.0",
    "pydantic>=2.0.0,<3.0",
]

[project.scripts]
remagraph = "remagraph.server:main"

[project.optional-dependencies]
vector = ["sqlite-vec>=0.1.0"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "mutmut>=2.0,<3.0",
    "ruff>=0.4",
    "mypy>=1.0",
    "pre-commit>=3.0",
]

[project.urls]
Homepage = "https://github.com/aiken884/RemaGraph"

# `install-hooks` 需要在執行期（editable install / wheel 安裝皆同）透過
# importlib.resources 讀到 src/remagraph/hooks/post-commit 這個非 .py 的
# package data 檔案。hatchling 對 src-layout 的預設行為本來就會把偵測到的
# package 目錄底下所有檔案（不限副檔名）一併打包進 wheel/sdist ——
# 已實際執行 `uv build`／`uv build --wheel` 並用 zipfile/tarfile 檢視內容
# 驗證過 remagraph/hooks/post-commit 確實存在於兩者之中。這裡仍明確宣告
# packages，把這個目前『預設剛好正確』的行為釘死成『明確設定』，避免日後
# hatchling 版本更新或旁人調整 pyproject.toml 時，在不知情下改掉自動偵測
# 邏輯而悄悄漏掉這個檔案。
[tool.hatch.build.targets.wheel]
packages = ["src/remagraph"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
exclude = ["tests/"]

[tool.mutmut]
# 0.7.0（PPLX 審查定案）：範圍擴大至核心業務邏輯與新模組。
# 依審查的執行時間條款（單輪目標 <6h GitHub Actions 上限）本輪納入
# store/search/prompt_hook/audit；maintenance.py 與 hooks_installer.py
# 連同 db.py 記為技術債。
# TODO(0.8.0): add db.py, maintenance.py, hooks_installer.py to mutation
# scope — migration logic is exactly where mutation testing pays off.
# 估算依據（審查條件 B.2）：納入模組合計約 2,600 行，--use-coverage 限縮
# 至有覆蓋的行後粗估 1,000–1,500 mutants；mutmut 對每個 mutant 以首個
# 失敗即停的方式跑測試，平均每 mutant 數秒，單輪預估 2–4 小時。
paths_to_mutate = [
    "src/remagraph/arbitration.py",
    "src/remagraph/dedup.py",
    "src/remagraph/store.py",
    "src/remagraph/search.py",
    "src/remagraph/prompt_hook.py",
    "src/remagraph/audit.py",
]
tests_dir = "tests/"
runner = "pytest -x -q"
backup = false
# 等效突變噪音抑制（審查條件 B.4）：logging 呼叫、常數字串等已知噪音源
# 於首輪結果整理時以 `# pragma: no mutate` 標注；首輪 issue 需區分
# 等效突變（不補）與真實測試缺口（補測試）。
