[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "remagraph"
version = "0.1.0"
description = "輕量 MCP 工具：記錄 AI coding agent 處理任務時留下的痕跡（task handoff / status update / discovered constraint），供後續 agent 查詢。"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [
    { name = "Aiken Lin" },
]
dependencies = [
    "model2vec>=0.1.0,<2.0",
    "mcp>=1.0.0,<2.0",
    "pydantic>=2.0.0,<3.0",
]

[project.scripts]
remagraph = "remagraph.server:main"

[project.optional-dependencies]
vector = ["sqlite-vec>=0.1.0"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "mutmut>=2.0,<3.0",
    "ruff>=0.4",
    "mypy>=1.0",
    "pre-commit>=3.0",
]

[project.urls]
Homepage = "https://github.com/aiken884/RemaGraph"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.ruff.format]
quote-style = "double"

[tool.mutmut]
paths_to_mutate = [
    "src/remagraph/arbitration.py",
    "src/remagraph/dedup.py",
]
tests_dir = "tests/"
runner = "pytest"
backup = false
